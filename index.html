<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>WISH 멤버 매칭 테스트</title>
<style>
  @font-face{
    font-family:'Goyang';
    src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_one@1.0/Goyang.woff') format('woff');
    font-weight:normal;
    font-style:normal;
    font-display:swap;
  }
  :root{
    /* pastel neon green palette */
    --pink:      #d9f5b8;  /* light lime */
    --pink-mid:  #b6e890;  /* mid neon-lime */
    --pink-deep: #82c45a;  /* deep grass */
    --peach:     #f0ffb3;  /* yellow-lime */
    --lav:       #c8eea8;  /* soft lime */
    --lav-mid:   #9fd97a;  /* neon green pastel */
    --lav-deep:  #5fa83f;  /* deep neon green */
    --ink:       #2f4a25;  /* deep forest text */
    --ink-2:     #6b8a5c;  /* muted sage */
    --bg-1:      #f4ffe0;
    --bg-2:      #ecffd1;
    --bg-3:      #e3fac4;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-family:'Goyang','Apple SD Gothic Neo',sans-serif;}
  html,body{height:100%;}
  body{
    color:var(--ink);
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:20px;
    font-weight:700;
    background:
      radial-gradient(circle at 10% 10%, #e0ffb3 0%, transparent 35%),
      radial-gradient(circle at 90% 20%, #d0f5a0 0%, transparent 35%),
      radial-gradient(circle at 80% 90%, #f4ffc8 0%, transparent 40%),
      radial-gradient(circle at 20% 85%, #c8f090 0%, transparent 40%),
      linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
    overflow-x:hidden;
    position:relative;
  }

  /* ==== SVG sparkles ==== */
  .spark{display:inline-block;vertical-align:middle;line-height:0;}
  .spark svg{display:block;}
  /* default: black sparkle for floating decos */
  .spark        {color:#1f2a14;}
  .spark-lav    {color:#1f2a14;}
  .spark-pink   {color:#1f2a14;}
  .spark-peach  {color:#1f2a14;}
  .spark-deep   {color:#1f2a14;}

  /* floating decorations */
  .float-deco{position:fixed;pointer-events:none;}
  .fd1{top:8%;  left:12%; animation:floaty 5s   ease-in-out infinite;}
  .fd2{top:14%; left:78%; animation:floaty 5.5s ease-in-out infinite -2s;}
  .fd3{top:38%; left:6%;  animation:floaty 4.8s ease-in-out infinite -1s;}
  .fd4{top:54%; left:88%; animation:floaty 5.2s ease-in-out infinite -3s;}
  .fd5{top:72%; left:18%; animation:floaty 6s   ease-in-out infinite -1.5s;}
  .fd6{top:84%; left:72%; animation:floaty 5.7s ease-in-out infinite -2.5s;}
  .fd7{top:46%; left:48%; animation:floaty 5.3s ease-in-out infinite -3.5s;}
  @keyframes floaty{
    0%,100%{transform:translateY(0) rotate(-6deg);}
    50%{transform:translateY(-12px) rotate(6deg);}
  }
  @keyframes pop{
    0%{transform:scale(.7);opacity:0;}
    60%{transform:scale(1.06);opacity:1;}
    100%{transform:scale(1);}
  }
  @keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
  }
  @keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.12);}
  }
  @keyframes drift{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
  }

  .app{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:28px;
    padding:6px;
    box-shadow:
      0 1px 0 #fff inset,
      0 18px 50px rgba(127,200,90,.28),
      0 4px 12px rgba(0,0,0,.05);
    position:relative;
    border:3px dashed #d4f0a8;
    z-index:1;
  }
  .app-inner{
    background:#fffefb;
    border-radius:22px;
    padding:30px 24px 28px;
    position:relative;
    overflow:hidden;
  }

  .screen{display:none;}
  .screen.active{display:block;animation:pop .45s cubic-bezier(.34,1.56,.64,1);}

  /* ===== COVER ===== */
  .cover{text-align:center;padding:6px 4px;}
  .kicker{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--lav);
    color:#3d6f2a;
    padding:6px 18px;
    border-radius:999px;
    font-size:16px;
    margin-bottom:22px;
    transform:rotate(-3deg);
    box-shadow:0 3px 0 var(--lav-mid);
  }
  .cover h1{
    font-size:34px;
    font-weight:700;
    line-height:1.35;
    margin-bottom:14px;
    color:var(--ink);
  }
  .cover h1 .hl{
    background:linear-gradient(transparent 55%, #c4e6f0 55%);
    padding:0 6px;
  }

  .cover .sub{
    color:var(--ink-2);
    font-size:18px;
    line-height:1.6;
    margin-bottom:26px;
  }
  .cover .sub b{color:var(--lav-deep);}

  .btn{
    border:none;cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn:active{transform:translateY(3px);}
  .btn.primary{
    background:linear-gradient(180deg, #b6e890, #82c45a);
    color:#fff;
    padding:14px 36px;
    border-radius:999px;
    font-size:22px;
    box-shadow:0 5px 0 var(--lav-deep), 0 8px 18px rgba(95,168,63,.35);
    letter-spacing:.5px;
    text-shadow:0 1px 0 rgba(0,0,0,.08);
  }
  .btn.primary:active{box-shadow:0 1px 0 var(--lav-deep);}
  .btn.primary .spark{color:#fff;}

  .btn.ghost{
    background:#fff;
    color:var(--ink-2);
    padding:11px 22px;
    border-radius:999px;
    font-size:17px;
    border:2px solid #d4f0a8;
    box-shadow:0 3px 0 #d4f0a8;
  }
  .btn.ghost:active{box-shadow:0 1px 0 #d4f0a8;}

  /* ===== QUIZ ===== */
  .quiz .topbar{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .pill{
    background:#e8f7d4;
    color:var(--lav-deep);
    padding:4px 14px;
    border-radius:999px;
    font-size:16px;
  }
  .progress-wrap{
    flex:1;
    height:10px;
    background:#e8f7d4;
    border-radius:999px;
    border:2px solid var(--lav);
    overflow:hidden;
  }
  .progress-bar{
    height:100%;
    background:linear-gradient(90deg, var(--lav-mid), #82c0e0);
    border-radius:999px;
    transition:width .4s cubic-bezier(.4,1.4,.6,1);
  }
  .question{
    font-size:24px;
    line-height:1.5;
    margin:24px 0 22px;
    color:var(--ink);
    text-align:center;
    padding:20px 14px 14px;
    background:linear-gradient(180deg,#f4ffe0,#ecffd1);
    border-radius:18px;
    border:2px dashed var(--lav);
    position:relative;
  }
  .question .q-spark{
    position:absolute;
    top:-18px;left:50%;transform:translateX(-50%);
    background:#fff;
    width:36px;height:36px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    border:2px solid var(--lav);
  }

  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    background:#fff;
    border:2px solid var(--lav);
    border-radius:16px;
    padding:13px 16px;
    font-size:18px;
    text-align:left;
    cursor:pointer;
    transition:all .12s ease;
    color:var(--ink);
    line-height:1.4;
    box-shadow:0 3px 0 var(--lav);
    display:flex;align-items:center;gap:12px;
    font-weight:700;
  }
  .option .dot{
    width:24px;height:24px;border-radius:50%;
    background:#e8f7d4;
    border:2px solid var(--lav-mid);
    flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
    color:var(--lav-deep);
  }
  .option:hover{background:#f4ffe0;transform:translateY(-1px);}
  .option:active{transform:translateY(2px);box-shadow:0 1px 0 var(--lav);}

  /* ===== RESULT ===== */
  .result{text-align:center;}
  .result .badge{
    display:inline-flex;align-items:center;gap:8px;
    background:#f4ffc8;
    color:#3d6f2a;
    padding:5px 16px;
    border-radius:999px;
    font-size:16px;
    margin-bottom:14px;
    transform:rotate(-2deg);
  }
  .polaroid{
    background:#fff;
    padding:14px 14px 48px;
    border-radius:8px;
    box-shadow:0 10px 28px rgba(0,0,0,.12);
    position:relative;
    margin:8px auto 22px;
    max-width:260px;
    transform:rotate(-2deg);
    animation:pop .5s cubic-bezier(.34,1.56,.64,1);
  }
  .polaroid::before{
    content:"";
    position:absolute;top:-12px;left:50%;transform:translateX(-50%) rotate(-3deg);
    width:80px;height:18px;
    background:rgba(159,217,122,.6);
    border-radius:2px;
  }
  .polaroid .photo{
    aspect-ratio:1;
    background:linear-gradient(135deg, #d9f5a8 0%, #c8e8ec 55%, #b8dcf0 100%);
    border-radius:4px;
    display:flex;align-items:center;justify-content:center;
    font-size:100px;
    position:relative;
    overflow:hidden;
  }
  .polaroid .photo::after{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.4) 0%, transparent 30%),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,.3) 0%, transparent 30%);
  }
  .polaroid .photo .sp-tl,
  .polaroid .photo .sp-br{
    position:absolute;
    z-index:2;
  }
  .polaroid .photo .sp-tl{top:10px;left:10px;animation:pulse 2s ease-in-out infinite;}
  .polaroid .photo .sp-br{bottom:14px;right:12px;animation:pulse 2.4s ease-in-out infinite -1s;}

  .polaroid .caption{
    position:absolute;bottom:12px;left:0;right:0;
    text-align:center;
    font-size:18px;
    color:var(--ink);
    letter-spacing:1px;
  }
  .result h2{
    font-size:38px;
    margin-bottom:4px;
    color:var(--ink);
  }
  .result .tagline{
    color:var(--lav-deep);
    margin-bottom:18px;
    font-size:19px;
  }
  .result .desc{
    background:#fdffec;
    padding:16px 18px;
    border-radius:18px;
    border:2px dashed #f4e890;
    color:#3d5a30;
    line-height:1.7;
    text-align:left;
    margin-bottom:22px;
    font-size:18px;
  }
  .result .desc strong{color:var(--lav-deep);}
  .actions{display:flex;flex-direction:column;gap:10px;}
</style>
</head>
<body>

  <!-- SVG library -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="ico-spark" viewBox="0 0 40 40">
        <path fill="currentColor" d="M20 1 C21.5 16, 24 18.5, 39 20 C24 21.5, 21.5 24, 20 39 C18.5 24, 16 21.5, 1 20 C16 18.5, 18.5 16, 20 1 Z"/>
      </symbol>
    </defs>
  </svg>

  <!-- floating decorations -->
  <span class="spark float-deco fd1"><svg width="22" height="22"><use href="#ico-spark"/></svg></span>
  <span class="spark float-deco fd2"><svg width="18" height="18"><use href="#ico-spark"/></svg></span>
  <span class="spark float-deco fd3"><svg width="20" height="20"><use href="#ico-spark"/></svg></span>
  <span class="spark float-deco fd4"><svg width="16" height="16"><use href="#ico-spark"/></svg></span>
  <span class="spark float-deco fd5"><svg width="14" height="14"><use href="#ico-spark"/></svg></span>
  <span class="spark float-deco fd6"><svg width="20" height="20"><use href="#ico-spark"/></svg></span>
  <span class="spark float-deco fd7"><svg width="16" height="16"><use href="#ico-spark"/></svg></span>

  <div class="app">
    <div class="app-inner">

      <!-- COVER -->
      <div id="cover" class="screen cover active">
        <div class="kicker">
          <span class="spark spark-deep"><svg width="14" height="14"><use href="#ico-spark"/></svg></span>
          WISH 매칭 테스트
          <span class="spark spark-deep"><svg width="14" height="14"><use href="#ico-spark"/></svg></span>
        </div>
        <h1>나랑 어울리는<br/><span class="hl">WISH 멤버</span>는?</h1>

        <p class="sub">
          7개의 질문에 답하면<br/>
          나와 찰떡인 <b>멤버</b>를 알려줄게!
        </p>
        <button class="btn primary" id="start-btn">테스트 시작</button>
      </div>

      <!-- QUIZ -->
      <div id="quiz" class="screen quiz">
        <div class="topbar">
          <span class="pill" id="step-label">Q1 / 7</span>
          <div class="progress-wrap"><div class="progress-bar" id="progress"></div></div>
        </div>
        <div class="question" id="question">
          <span class="q-spark spark spark-deep"><svg width="18" height="18"><use href="#ico-spark"/></svg></span>
          <span id="question-text"></span>
        </div>
        <div class="options" id="options"></div>
      </div>

      <!-- RESULT -->
      <div id="result" class="screen result">
        <span class="badge">
          <span class="spark spark-peach"><svg width="14" height="14"><use href="#ico-spark"/></svg></span>
          너랑 어울리는 멤버는...
        </span>
        <div class="polaroid">
          <div class="photo">
            <span class="sp-tl spark spark-lav"><svg width="18" height="18"><use href="#ico-spark"/></svg></span>
            <span class="sp-br spark spark-pink"><svg width="14" height="14"><use href="#ico-spark"/></svg></span>
            <span id="result-emoji">💖</span>
          </div>
          <div class="caption" id="result-caption"></div>
        </div>
        <h2 id="result-name"></h2>
        <div class="tagline" id="result-tagline"></div>
        <div class="desc" id="result-desc"></div>
        <div class="actions">
          <button class="btn primary" id="retry-btn">다시 테스트하기</button>
          <button class="btn ghost" id="share-btn">결과 공유하기</button>
        </div>
      </div>

    </div>
  </div>

<script>
  const MEMBERS = {
    yushi:  { name:"유우시", emoji:"⭐",     caption:"with YUSHI",
               tagline:"장난기 가득한 분위기 메이커",
               desc:"<strong>웃음이 끊이지 않는 연애</strong>를 꿈꾸는 너! 유우시는 어딜 가도 분위기를 띄우는 장난꾸러기. 맛집 탐방하고, 매운 거 같이 먹고, 가끔 시치미도 떼는 그런 사이. 심심할 틈이 없을걸." },
    sakuya:  { name:"사쿠야", emoji:"🥐",    caption:"with SAKUYA",
               tagline:"직진하는 테토남",
               desc:"<strong>당당하고 솔직한 연애</strong>가 어울리는 너! 사쿠야는 좋아하면 좋아한다고 말하는 직진형. 동대문 같이 가서 옷 고르고, 깔끔한 거 좋아하고, 화났냐고 먼저 물어보는 타입." },
    sion:   { name:"시온", emoji:"🌷",      caption:"with SION",
               tagline:"차분하고 지적인 사람",
               desc:"<strong>고요하지만 깊이 있는 연애</strong>를 원하는 너! 시온은 미술관 데이트가 어울리고, 모든 걸 논리적으로 설명해줘. 청포도 그린티 당도0 알로에 추가 같은 디테일에 진심인 사람." },
    riku:    { name:"리쿠", emoji:"🐈‍⬛",     caption:"with RIKU",
               tagline:"애교 많은 사랑둥이",
               desc:"<strong>달콤하고 포근한 연애</strong>를 꿈꾸는 너! 리쿠는 집 데이트도 좋아하고, 애교로 분위기 풀고, 민초도 좋아하는 통통 튀는 매력. 두바이 여행 같이 가면 인생샷 찍어줄 거야." },
    jaehee:  { name:"재희", emoji:"🌳",      caption:"with JAEHEE",
               tagline:"다정함의 끝판왕",
               desc:"<strong>따뜻하고 섬세한 연애</strong>가 어울리는 너! 재희는 성수 감성 카페 데이트, 잘못하면 47차 사과문 제출, 코트+맨투맨의 정석룩. 다정함이 본체인 사람." },
    ryo:     { name:"료", emoji:"🦭",        caption:"with RYO",
               tagline:"챙겨주고 싶은 댕댕이",
               desc:"<strong>귀엽고 풋풋한 연애</strong>를 원하는 너! 료는 영화관 데이트, 들키면 심하게 당황, 망고 요구르트랑 망고 아이스바 좋아하는 망고러버. 옆에서 챙겨주고 싶은 매력." }
  };

  const QUESTIONS = [
    {
      q:"오랜만에 애인과 만나기로 한 너! 어디서 만날래?",
      options:[
        { text:"맛집",                 m:"yushi" },
        { text:"동대문",                m:"sakuya" },
        { text:"미술관",                m:"sion" },
        { text:"집",                    m:"riku" },
        { text:"성수 감성 카페",         m:"jaehee" },
        { text:"영화관",                m:"ryo" },
      ]
    },
    {
      q:"가장 끌리는 타입은?",
      options:[
        { text:"장난기 많은",       m:"sion" },
        { text:"재미있는",          m:"yushi" },
        { text:"애교 많은",         m:"riku" },
        { text:"챙겨주고 싶은",     m:"ryo" },
        { text:"테토남",            m:"sakuya" },
        { text:"다정한",            m:"jaehee" },
      ]
    },
    {
      q:"연인이 다른 사람과 다정하게 있는 모습을 목격! 연인의 변명은?",
      options:[
        { text:"내가 그랬나?",                       m:"yushi" },
        { text:"에? 화났어?",                        m:"sakuya" },
        { text:"오해인 이유를 논리적으로 설명",       m:"sion" },
        { text:"애교로 무마한다",                    m:"riku" },
        { text:"사과한다 (47차 사과문까지 제출함)",   m:"jaehee" },
        { text:"심하게 당황한다",                    m:"ryo" },
      ]
    },
    {
      q:"카페에서 연인을 기다리는 중! 미리 주문해 달라는 말에 시킨 음료는?",
      options:[
        { text:"청포도 그린티, 당도 0에 알로에 코코넛 추가",  m:"sion" },
        { text:"잘 몰라서 옆 사람 거를 따라함",               m:"jaehee" },
        { text:"제주 그린 밀크티",                            m:"riku" },
        { text:"브라운슈가 쥬얼리 밀크티, 펄 추가",            m:"yushi" },
        { text:"브라운슈가 쥬얼리 밀크티, 펄 빼고",            m:"sakuya" },
        { text:"망고 요구르트",                               m:"ryo" },
      ]
    },
    {
      q:"여행을 어디로 떠날까?",
      options:[
        { text:"스페인",   m:"yushi" },
        { text:"프랑스",   m:"sakuya" },
        { text:"영국",     m:"sion" },
        { text:"두바이",   m:"riku" },
        { text:"태국",     m:"jaehee" },
        { text:"일본",     m:"ryo" },
      ]
    },
    {
      q:"같이 먹고 싶은 아이스크림은?",
      options:[
        { text:"바닐라 아이스크림", m:"sakuya" },
        { text:"민트초코",          m:"riku" },
        { text:"초콜릿",            m:"sion" },
        { text:"비비빅",            m:"yushi" },
        { text:"망고 아이스바",     m:"ryo" },
        { text:"티코",              m:"jaehee" },
      ]
    },
    {
      q:"야식으로 끌리는 라면은?",
      options:[
        { text:"라면 안 좋아함",   m:"sakuya" },
        { text:"불닭볶음면",       m:"yushi" },
        { text:"너구리",           m:"riku" },
        { text:"사리곰탕",         m:"ryo" },
        { text:"김치왕뚜껑",       m:"jaehee" },
        { text:"무파마",           m:"sion" },
      ]
    }
  ];

  const $ = (id)=>document.getElementById(id);
  const show = (id)=>{
    document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
    $(id).classList.add("active");
    window.scrollTo({top:0,behavior:"smooth"});
  };

  let idx=0;
  let scores={};

  function resetScores(){
    scores={};
    Object.keys(MEMBERS).forEach(k=>scores[k]=0);
  }

  function renderQuestion(){
    const q = QUESTIONS[idx];
    $("step-label").textContent = `Q${idx+1} / ${QUESTIONS.length}`;
    $("progress").style.width = `${((idx)/QUESTIONS.length)*100}%`;
    $("question-text").textContent = q.q;

    const opts = $("options");
    opts.innerHTML = "";
    const shuffled = [...q.options].sort(()=>Math.random()-0.5);
    shuffled.forEach((opt, i)=>{
      const btn = document.createElement("button");
      btn.className = "option";
      btn.innerHTML = `<span class="dot">${i+1}</span><span>${opt.text}</span>`;
      btn.onclick = ()=>choose(opt.m);
      opts.appendChild(btn);
    });
  }

  function choose(memberKey){
    scores[memberKey] = (scores[memberKey]||0) + 1;
    idx++;
    if(idx < QUESTIONS.length){
      renderQuestion();
    } else {
      $("progress").style.width = "100%";
      showResult();
    }
  }

  function showResult(){
    const maxScore = Math.max(...Object.values(scores));
    const top = Object.keys(scores).filter(k=>scores[k]===maxScore);
    const winner = top[Math.floor(Math.random()*top.length)];
    const m = MEMBERS[winner];
    $("result-emoji").textContent = m.emoji;
    $("result-caption").textContent = m.caption;
    $("result-name").textContent = m.name;
    $("result-tagline").textContent = m.tagline;
    $("result-desc").innerHTML = m.desc;
    show("result");
  }

  $("start-btn").onclick = ()=>{
    idx = 0;
    resetScores();
    renderQuestion();
    show("quiz");
  };

  $("retry-btn").onclick = ()=>{
    idx = 0;
    resetScores();
    renderQuestion();
    show("quiz");
  };

  $("share-btn").onclick = async ()=>{
    const name = $("result-name").textContent;
    const text = `나와 어울리는 WISH 멤버는 ${name}! 너는 누구일까?`;
    if(navigator.share){
      try { await navigator.share({ title:"WISH 매칭 테스트", text, url:location.href }); } catch(_){}
    } else {
      try {
        await navigator.clipboard.writeText(`${text} ${location.href}`);
        alert("결과 링크가 복사됐어요!");
      } catch(_){ alert(text); }
    }
  };
</script>
</body>
</html>
